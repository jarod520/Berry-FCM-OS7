name: BerryFCM KSU source and runtime smoke gates

on:
  push:
    branches:
      - fix/rc5-mcs-patrol-20261122
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: berry-ksu-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ksu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Shell syntax gate
        run: |
          set -eu
          for script in module/*.sh module/bin/*.sh tests/fcm-monitor-smoke.sh tests/ksu-wake-smoke.sh; do
            sh -n "$script"
          done
      - name: KSU monitor recovery smoke
        run: sh tests/fcm-monitor-smoke.sh
      - name: KSU patrol and supervisor lifecycle smoke
        run: sh -x tests/ksu-wake-smoke.sh
      - name: Whitespace and patch integrity
        run: git diff --check HEAD^ HEAD
