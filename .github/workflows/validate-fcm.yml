name: Validate BerryFCM shell lifecycle

on:
  push:
    branches:
      - 'fix/**'
    paths:
      - 'module/**'
      - 'tests/**'
      - '.github/workflows/validate-fcm.yml'
  pull_request:
    paths:
      - 'module/**'
      - 'tests/**'
      - '.github/workflows/validate-fcm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-fcm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-and-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          for script in module/*.sh module/bin/*.sh tests/*.sh; do
            sh -n "$script"
          done
      - name: Run FCM monitor regression tests
        run: sh tests/fcm-monitor-smoke.sh
      - name: Run KernelSU wake lifecycle tests
        run: sh tests/ksu-wake-smoke.sh
