name: Build KernelSU ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ksu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts and FCM lifecycle monitor
        run: |
          for script in module/*.sh module/bin/*.sh; do sh -n "$script"; done
          sh tests/fcm-monitor-smoke.sh
          sh tests/diagnostic-logs-smoke.sh
          sh tests/ksu-wake-smoke.sh
          sh tests/apk-no-dump-smoke.sh
      - name: Validate embedded WebUI JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('module/webroot/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No inline WebUI script found')
          Path('/tmp/berryfcm-webui.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/berryfcm-webui.js
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Build ARM64 wake timer
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags '-s -w' -o module/bin/wake-timer-arm64 module-src/wake-timer.go
          test -x module/bin/wake-timer-arm64
      - name: Package KernelSU module
        id: package
        run: |
          test -f module/module.prop
          mkdir -p dist
          version="$(sed -n 's/^version=//p' module/module.prop)"
          test -n "$version"
          printf '%s\n' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.-]+)?$'
          code="$(sed -n 's/^versionCode=//p' module/module.prop)"
          printf '%s\n' "$code" | grep -Eq '^[1-9][0-9]*$'
          echo "name=BerryFCM-KSU-v$version" >> "$GITHUB_OUTPUT"
          cd module
          zip -qr "../dist/BerryFCM-KSU-v$version.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 30
