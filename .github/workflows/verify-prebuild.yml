name: BerryFCM pre-build source and functional gates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: berry-prebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify GMS monitoring shell syntax and native recovery behavior
        run: |
          set -eu
          sh -n app/src/main/assets/fcm-monitor.sh
          sh tests/apk-native-fcm-smoke.sh
          sh tests/apk-no-dump-smoke.sh
      - name: Verify UI, Android permissions, release discipline and icon semantics
        run: sh tests/apk-module-smoke.sh
      - name: Pre-build source and whitespace audit
        run: |
          set -eu
          git diff --check HEAD^ HEAD
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root=Path("app/src/main")
          for p in list((root/"res/drawable").glob("ic_bf_*.xml")) + list((root/"res/layout").glob("berry_fcm_*.xml")):
              ET.parse(p)
          svc=(root/"java/top/zesun/berryfcm/FcmMonitorService.java").read_text()
          ui=(root/"java/top/zesun/berryfcm/Ui.java").read_text()
          assert svc.count('.setSmallIcon(R.drawable.ic_berry_fcm_mono)') == 1
          assert 'return "后台监控运行中（连接详情请在应用内查看）"' not in svc
          assert 'R.layout.berry_fcm_notification_status' in svc
          assert 'return R.drawable.ic_bf_info;' in ui
          assert 'ic_bf_heartbeat' in ui
          print("PASS: XML parsing, app icon unchanged, GMS notification status and UI semantics")
          PY
